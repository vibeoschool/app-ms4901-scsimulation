<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달 관측관</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
  /* 원본 시뮬레이션을 그대로 불러오는 프레임 (원본 수정 시 자동 반영) */
  .sim-frame{position:fixed;inset:0;width:100%;height:100%;border:0}
  .home-btn{position:fixed;top:16px;left:16px;z-index:9999;display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:999px;font:600 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#e8eefc;text-decoration:none;background:rgba(20,28,48,.72);border:1px solid rgba(120,150,220,.35);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:transform .15s ease,background .2s ease,border-color .2s ease}
  .home-btn:hover{background:rgba(40,58,100,.9);border-color:rgba(150,180,255,.6);transform:translateY(-1px)}
  .home-btn span{font-size:16px;transition:transform .15s ease}
  .home-btn:hover span{transform:translateX(-3px)}
  @media (max-width:600px){.home-btn{top:10px;left:10px;padding:8px 13px;font-size:13px}}
</style>
</head>
<body>
  <a href="index.html" class="home-btn" aria-label="메인으로 돌아가기"><span aria-hidden="true">←</span> Home</a>
  <iframe class="sim-frame" src="moon.html" title="달 관측관 시뮬레이션"
          allow="fullscreen" allowfullscreen></iframe>
</body>
</html>
